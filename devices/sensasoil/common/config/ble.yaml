substitutions:
  # Improv BLE
  IMPROV_SERVICE_UUID: "00467768-6228-2272-4663-277478268000"
  IMPROV_STATUS_UUID: "00467768-6228-2272-4663-277478268001"
  IMPROV_ERROR_UUID: "00467768-6228-2272-4663-277478268002"
  IMPROV_RPC_COMMAND_UUID: "00467768-6228-2272-4663-277478268003"
  IMPROV_RPC_RESULT_UUID: "00467768-6228-2272-4663-277478268004"
  IMPROV_CAPABILITIES_UUID: "00467768-6228-2272-4663-277478268005"
  # TierraLive BLE
  TIERRALIVE_SERVICE_UUID: "3b351f04-1db6-49f3-b155-cb5d18c80000"
  TIERRALIVE_INFO_UUID: "3b351f04-1db6-49f3-b155-cb5d18c80001"
  TIERRALIVE_SENSASOIL_CODE: "0x01"
  TIERRALIVE_SENSASOIL_INFO_UUID: "3b351f04-1db6-49f3-b155-cb5d18c80002"
  # Timeouts
  DELAY_BLE_SERVER_CLOSE_MS: "5 * 60 * 1000"

globals:
  # INTERNAL #
  - id: last_ble_communication_timestamp
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: improv_state
    type: improv::State
    restore_value: no
  - id: device_setup_state
    type: sensasoil::BleSetupState
    restore_value: no
    initial_value: sensasoil::BleSetupState::INIT
  - id: temp_wifi_ssid
    type: std::string
    restore_value: no
  - id: temp_wifi_password
    type: std::string
    restore_value: no

esp32_ble:
  id: ble_id
  enable_on_boot: False
  max_connections: 1
  # TODO: Test auth_req_mode: sc_mitm

esp32_ble_server:
  id: ble_server
  manufacturer: TierraLive
  model: SensaSoil_${HARDWARE_VERSION}
  max_clients: 1
  on_connect:
    - lambda: |-
        // Refresh sensors on BLE connection to have updated values
        id(improv_read_sensors)->execute();
        id(last_ble_communication_timestamp) = millis();
  services:
    - uuid: 0x180F
      advertise: false
      characteristics: 
        - uuid: 0x2A19
          id: ble_battery_level_char
          read: true
          notify: true
          value: !lambda |-
            return { static_cast<uint8_t>(std::round(id(battery_level).state)) };
        - uuid: 0x2BED
          id: ble_battery_status_char
          read: true
          notify: true
          value: !lambda |-
            // Flags field (8 bits)
            uint8_t flags = 0b00000010;
            // Power state field (16 bits)
            uint16_t power_state = 0b0000000000000000;
            // Battery present (bit 0)
            // Assume always 1 (we cannot check that)
            power_state |= 0b0000000000000001;
            // Wired external power source connected (bits 1-2)
            if (id(is_plugged_in_charging).state) {
              power_state |= (0b01 << 1);
            } else if (!id(is_solar_charging).state && id(is_battery_charging).state) {
              power_state |= (0b10 << 1);  // Unknown
            }
            // Wireless external power source connected (bits 3-4)
            if (id(is_solar_charging).state) {
              power_state |= (0b01 << 3);
            } else if (!id(is_plugged_in_charging).state && id(is_battery_charging).state) {
              power_state |= (0b10 << 3);  // Unknown
            }
            // Battery charge state (bits 5-6)
            if (id(is_battery_charging).state) {
              // Charging
              power_state |= (0b01 << 5);
            } else {
              // Discharging
              power_state |= (0b10 << 5);
            }
            // Battery charge level (bits 7-8)
            float bat_level = id(battery_level).state;
            if (bat_level <= 5.0) {
              // Critical
              power_state |= (0b11 << 7);
            } else if (bat_level <= 20.0) {
              // Low
              power_state |= (0b10 << 7);
            } else {
              // Good
              power_state |= (0b01 << 7);
            }
            // Display battery level too
            uint8_t battery_level_output = static_cast<uint8_t>(std::round(bat_level));
            return { flags, static_cast<uint8_t>(power_state & 0xFF), static_cast<uint8_t>((power_state >> 8) & 0xFF), battery_level_output };
    - uuid: ${TIERRALIVE_SERVICE_UUID}
      advertise: true
      characteristics:
        - uuid: ${TIERRALIVE_INFO_UUID}
          read: true
          value: !lambda |-
            // Build payload: 1 byte device code, 6 bytes MAC = 7 bytes total
            bytebuffer::ByteBuffer buf = bytebuffer::ByteBuffer(7);
            // Device code (sensasoil)
            buf.put_uint8(${TIERRALIVE_SENSASOIL_CODE});
            // MAC
            uint8_t mac[6];
            get_mac_address_raw(mac);
            buf.put_vector(std::vector<uint8_t>(mac, mac + 6));
            return buf.get_data();
        - uuid: ${TIERRALIVE_SENSASOIL_INFO_UUID}
          id: ble_sensasoil_info_char
          read: true
          notify: true
          value: !lambda |-
            // Build payload: 5x4-byte floats = 20 bytes total
            bytebuffer::ByteBuffer buf = bytebuffer::ByteBuffer(20);
            // Ambient temperature
            buf.put_float(id(ambient_temperature).state);
            // Ambient humidity
            buf.put_float(id(ambient_humidity).state);
            // Soil temperature
            buf.put_float(id(soil_temperature).state);
            // Soil volumetric water (percentage)
            buf.put_float(id(soil_volumetric_water).state);
            // Soil volumetric water voltage
            buf.put_float(id(soil_volumetric_water_v).state);
            return buf.get_data();
    - uuid: ${IMPROV_SERVICE_UUID}
      advertise: true
      characteristics:
        - uuid: ${IMPROV_STATUS_UUID}
          id: improv_status_characteristic
          read: true
          notify: true
          value: !lambda return {id(improv_state)};
        - uuid: ${IMPROV_ERROR_UUID}
          id: improv_error_characteristic
          read: true
          notify: true
        - uuid: ${IMPROV_RPC_COMMAND_UUID}
          write: true
          on_write:
            then:
              - lambda: |-
                  static std::vector<uint8_t> improv_buffer;
                  static std::function<void(const improv::Error&)> set_error_notify_and_clear = [](improv::Error error) {
                    id(improv_error_characteristic)->set_value(error);
                    id(improv_error_characteristic)->notify();
                    improv_buffer.clear();
                  };
                  static std::function<bool(const std::vector<std::vector<uint8_t>>&, size_t)> ensure_expected_length = [](const std::vector<std::vector<uint8_t>>& data, size_t expected_length) -> bool {
                    if (data.size() != expected_length) {
                      ESP_LOGW("ExtendedImprov", "Received data with invalid length: expected %d, got %d", expected_length, data.size());
                      set_error_notify_and_clear(improv::Error::ERROR_INVALID_RPC);
                      return false;
                    }
                    return true;
                  };
                  id(last_ble_communication_timestamp) = millis();
                  if (x.empty()) return;
                  improv_buffer.insert(improv_buffer.end(), x.begin(), x.end());
                  ESP_LOGD("ExtendedImprov", "Characteristic received: %s from %d", format_hex_pretty(std::string(improv_buffer.begin(), improv_buffer.end()).c_str()).c_str(), id);
                  uint8_t length = improv_buffer[1];
                  if (improv_buffer.size() - 3 == length) {
                    id(improv_error_characteristic)->set_value(improv::Error::ERROR_NONE);
                    id(improv_error_characteristic)->notify();
                    improv::ImprovCommand command = improv::parse_improv_data(improv_buffer);
                    switch (command.command) {
                      case improv::BAD_CHECKSUM:
                        ESP_LOGW("ExtendedImprov", "Error decoding Improv payload");
                        set_error_notify_and_clear(improv::Error::ERROR_INVALID_RPC);
                        break;
                      case improv::WIFI_SETTINGS: {
                        ESP_LOGD("ExtendedImprov", "WiFi settings received");
                        if (id(improv_state) == improv::State::STATE_PROVISIONING) {
                          ESP_LOGD("ExtendedImprov", "Settings received, but already provisioning");
                          set_error_notify_and_clear(improv::Error::ERROR_NOT_AUTHORIZED);
                          break;
                        }
                        if (!ensure_expected_length(command.data, 2)) break;
                        id(improv_state) = improv::State::STATE_PROVISIONING;
                        id(improv_status_characteristic)->notify();
                        id(improv_wifi_configure)->execute(std::string(command.data[0].begin(), command.data[0].end()), std::string(command.data[1].begin(), command.data[1].end()));
                        improv_buffer.clear();
                        break;
                      }
                      case improv::CUSTOM: {
                        ESP_LOGD("ExtendedImprov", "Custom command received");
                        switch(static_cast<sensasoil::ExtendedImprovCommand>(command.data[0][0])) {
                          case sensasoil::ExtendedImprovCommand::MQTT_SETTINGS: {
                            if (command.data.size() == 1) {
                              ESP_LOGD("ExtendedImprov", "Request of MQTT settings received");
                              id(improv_wifi_mqtt_show_config)->execute();
                              break;
                            }
                            if (id(improv_state) == improv::State::STATE_PROVISIONING) {
                              ESP_LOGD("ExtendedImprov", "MQTT settings received, but not authorized");
                              set_error_notify_and_clear(improv::Error::ERROR_NOT_AUTHORIZED);
                              break;
                            }
                            if (!ensure_expected_length(command.data, 7)) break;
                            ESP_LOGD("ExtendedImprov", "MQTT settings received");
                            id(improv_state) = improv::State::STATE_PROVISIONING;
                            id(improv_status_characteristic)->notify();
                            id(improv_mqtt_configure)->execute(
                              sensasoil::make_string(command.data[1].data(), command.data[1].size()),
                              bytebuffer::ByteBuffer::wrap(command.data[2]).get_uint16(),
                              sensasoil::make_string(command.data[3].data(), command.data[3].size()),
                              sensasoil::make_string(command.data[4].data(), command.data[4].size()),
                              command.data[5][0],
                              sensasoil::make_string(command.data[6].data(), command.data[6].size())
                            );
                            break;
                          }
                          case sensasoil::ExtendedImprovCommand::FACTORY_RESET:
                            ESP_LOGD("ExtendedImprov", "Factory reset received");
                            id(factory_reset_button).press();
                            break;
                          case sensasoil::ExtendedImprovCommand::WIFI_VIEW_SETTINGS:
                            ESP_LOGD("ExtendedImprov", "Request of WiFi settings received");
                            id(improv_wifi_ble_show_config)->execute();
                            break;
                          case sensasoil::ExtendedImprovCommand::DIAGNOSTIC: {
                            if (command.data.size() == 1) {
                              id(improv_diagnostic_show_config)->execute();
                              break;
                            }
                            ESP_LOGD("ExtendedImprov", "Diagnostic command received");
                            if (!ensure_expected_length(command.data, 2)) break;
                            bool diagnostic_enabled = command.data[1][0] != 0;
                            if (diagnostic_enabled) {
                              id(diagnostic_mode) = true;
                              id(mqtt_initial_connection_setup) = true;
                            } else {
                              id(diagnostic_mode) = false;
                            }
                            id(main_script)->execute();
                            break;
                          }
                          case sensasoil::ExtendedImprovCommand::BATTERY_SETTINGS: {
                            if (command.data.size() == 1) {
                              ESP_LOGD("ExtendedImprov", "Request of battery settings received");
                              id(improv_battery_show_config)->execute();
                              break;
                            }
                            ESP_LOGD("ExtendedImprov", "Battery settings command received");
                            if (!ensure_expected_length(command.data, 2)) break;
                            uint8_t mode = command.data[1][0];
                            switch (mode) {
                              case static_cast<uint8_t>(sensasoil::BatteryFloatingMode::MAX_LIFESPAN):
                                id(battery_floating_mode) = sensasoil::BatteryFloatingMode::MAX_LIFESPAN;
                                break;
                              case static_cast<uint8_t>(sensasoil::BatteryFloatingMode::BALANCED):
                                id(battery_floating_mode) = sensasoil::BatteryFloatingMode::BALANCED;
                                break;
                              case static_cast<uint8_t>(sensasoil::BatteryFloatingMode::MAX_CAPACITY):
                                id(battery_floating_mode) = sensasoil::BatteryFloatingMode::MAX_CAPACITY;
                                break;
                              default:
                                ESP_LOGW("ExtendedImprov", "Unknown battery settings mode received: %d", mode);
                            }
                            id(setup_battery)->execute(true);
                            break;
                          }
                          case sensasoil::ExtendedImprovCommand::REFRESH_SENSORS:
                            ESP_LOGD("ExtendedImprov", "Refresh sensors command received");
                            id(improv_read_sensors)->execute();
                            break;
                          case sensasoil::ExtendedImprovCommand::CALIBRATION: {
                            if (command.data.size() == 1) {
                              ESP_LOGD("ExtendedImprov", "Request of calibration settings received");
                              id(improv_calibration_show_config)->execute();
                              break;
                            }
                            ESP_LOGD("ExtendedImprov", "Calibrate sensors command received");
                            if (!ensure_expected_length(command.data, 5)) break;
                            // Receive: probe version (1 byte) + 3x4-byte floats in command.data[1-4]
                            uint8_t probe_version = command.data[1][0];
                            float calibration_temp = bytebuffer::ByteBuffer::wrap(command.data[2]).get_float();
                            float max_voltage = bytebuffer::ByteBuffer::wrap(command.data[3]).get_float();
                            float min_voltage = bytebuffer::ByteBuffer::wrap(command.data[4]).get_float();
                            ESP_LOGD("Calibration", "Received calibration data: probe_version=%d, temp=%.2f, max_voltage=%.3f, min_voltage=%.3f", probe_version, calibration_temp, max_voltage, min_voltage);
                            // Update calibration parameters
                            id(soil_probe_version) = static_cast<sensasoil::SoilProbeVersion>(probe_version);
                            id(soil_probe_calibration_temperature) = calibration_temp;
                            id(soil_probe_calibration_max_voltage) = max_voltage;
                            id(soil_probe_calibration_min_voltage) = min_voltage;
                            id(improv_read_sensors)->execute();
                            break;
                          }
                          default:
                            ESP_LOGW("ExtendedImprov", "Unknown Improv custom payload");
                            break;
                        }
                        improv_buffer.clear();
                        break;
                      }
                      case improv::IDENTIFY:
                        improv_buffer.clear();
                        ESP_LOGW("ExtendedImprov", "IDENTIFY not supported in this device");
                        break;
                      default:
                        ESP_LOGW("ExtendedImprov", "Unknown Improv payload");
                        set_error_notify_and_clear(improv::Error::ERROR_UNKNOWN_RPC);
                    }
                  } else if (improv_buffer.size() - 2 > length) {
                    ESP_LOGD("ExtendedImprov", "Too much data received or data malformed; resetting buffer...");
                    improv_buffer.clear();
                  } else {
                    ESP_LOGD("ExtendedImprov", "Waiting for split data packets...");
                  }
        - uuid: ${IMPROV_CAPABILITIES_UUID}
          read: true
          value:
            data: 0x00
            type: uint8_t
        - uuid: ${IMPROV_RPC_RESULT_UUID}
          id: improv_rpc_result
          read: true
          notify: true

script:
  - id: enable_ble
    then:
      - ble.enable:
      - wait_until:
          condition: ble.enabled
          timeout: 1min
      # Should never happen, but just in case, if BLE fails to enable, we restart the device
      - lambda: |-
          if (!id(ble_id)->is_active()) {
            ESP_LOGE("BLE Server", "Unexpected failure enabling BLE, restarting the device...");
            id(restart_button).press();
          }

  - id: serve_ble_server
    mode: restart
    then:
      - lambda: |-
          id(improv_state) = improv::State::STATE_AUTHORIZED;
          // Reset last BLE communication timestamp
          id(last_ble_communication_timestamp) = millis();
          // Display BLE status on LED
          auto call = id(led_status)->turn_on();
          call.set_effect("ble_status_effect");
          call.perform();
          // Turn on BLE
          id(enable_ble)->execute();
      - script.wait: enable_ble
      # If the last communication was more than 5 minutes ago, close the server
      - wait_until:
          condition:
            - lambda: ! return millis() - id(last_ble_communication_timestamp) >= ${DELAY_BLE_SERVER_CLOSE_MS};
          timeout:
            hours: 1 # Add just in case the user keeps accidentally forgets and keeps the BLE connection open
      # No need to turn off the LED here since it could override other status effects
      # Additionally, if the server is closed due to inactivity (and everything is all-right)
      # the device will turn off inmediately after, so it would be pointless to turn off the LED just before that

  - id: improv_wifi_configure
    parameters:
      ssid: std::string
      password: std::string
    then:
      - lambda: |-
          id(device_setup_state) = sensasoil::BleSetupState::WIFI_CONFIG;
          id(temp_wifi_ssid) = ssid;
          id(temp_wifi_password) = password;
          id(on_wifi_disconnect)->stop();
          id(on_mqtt_disconnect)->stop();
          auto call = id(led_status)->turn_off();
          call.perform();
      - wifi.configure:
          ssid: !lambda return ssid;
          password: !lambda return password;
          save: true
          timeout: 30s
          on_connect:
            - lambda: |-
                // WARNING: These are only saved to persistent storage when the device shutdown
                // or the device is on for more than SAVE_TO_STORAGE_USER_CONFIG_INTERVAL.
                // An unexpected power loss before that will cause the device to "forget" the settings
                id(wifi_ssid) = id(temp_wifi_ssid);
                id(wifi_password) = id(temp_wifi_password);
                id(device_setup_state) = sensasoil::BleSetupState::INIT;
                id(improv_state) = improv::State::STATE_PROVISIONED;
                id(improv_status_characteristic)->notify();
                id(main_script)->execute();
          on_error:
            - lambda: |-
                id(device_setup_state) = sensasoil::BleSetupState::INIT;
                id(improv_error_characteristic)->set_value(improv::Error::ERROR_UNABLE_TO_CONNECT);
                id(improv_error_characteristic)->notify();
                id(improv_state) = improv::State::STATE_AUTHORIZED;
                id(improv_status_characteristic)->notify();
                id(on_wifi_disconnect)->execute();

  - id: improv_mqtt_configure
    parameters:
      new_mqtt_broker_address: std::string
      new_mqtt_broker_port: uint16_t
      new_mqtt_username: std::string
      new_mqtt_password: std::string
      tls_flags: uint8_t
      new_mqtt_discovery_prefix: std::string
    then:
      - lambda: |-
          id(device_setup_state) = sensasoil::BleSetupState::MQTT_CONFIG;
          id(on_mqtt_disconnect)->stop();
          id(mqtt_setup)->stop();
          auto call = id(led_status)->turn_off();
          call.perform();
          id(mqtt_id)->disable();
      - wait_until:
        - not: mqtt.connected
      - delay: 5s
      - lambda: |-
          ESP_LOGD("MQTT Config", "Applying new MQTT settings: broker=%s, port=%d, username=%s, tls_flags=%02X", new_mqtt_broker_address.c_str(), new_mqtt_broker_port, new_mqtt_username.c_str(), tls_flags);
          // Store new settings in temporary variables while we test the connection
          id(mqtt_setup)->execute(new_mqtt_broker_address, new_mqtt_broker_port, new_mqtt_username, new_mqtt_password, tls_flags);
      - script.wait: mqtt_setup
      - lambda: |-
          if (id(mqtt_id)->is_connected()) {
            ESP_LOGD("MQTT Config", "Successfully connected with new MQTT settings");
            id(mqtt_initial_connection_setup) = true;
            id(improv_state) = improv::State::STATE_PROVISIONED;
            // Update MQTT settings since they are correct
            // WARNING: These are only saved to persistent storage when the device shutdown
            // or the device is on for more than SAVE_TO_STORAGE_USER_CONFIG_INTERVAL.
            // An unexpected power loss before that will cause the device to "forget" the settings
            id(mqtt_broker_address) = new_mqtt_broker_address;
            id(mqtt_broker_port) = new_mqtt_broker_port;
            id(mqtt_username) = new_mqtt_username;
            id(mqtt_password) = new_mqtt_password;
            id(mqtt_discovery_prefix) = new_mqtt_discovery_prefix;
          } else {
            ESP_LOGE("MQTT Config", "Failed to connect with new MQTT settings");
            // Notify the client about the failure
            id(improv_error_characteristic)->set_value(improv::Error::ERROR_UNABLE_TO_CONNECT);
            id(improv_error_characteristic)->notify();
            id(improv_state) = improv::State::STATE_AUTHORIZED;
            // Reset MQTT settings to previous values
            id(mqtt_id)->disable();
          }
          id(device_setup_state) = sensasoil::BleSetupState::INIT;
          id(improv_status_characteristic)->notify();
          id(main_script)->execute();

  - id: improv_wifi_mqtt_show_config
    then:
      - lambda: |-
          uint8_t response_command = static_cast<uint8_t>(sensasoil::ExtendedImprovCommand::MQTT_SETTINGS);
          bytebuffer::ByteBuffer payload = bytebuffer::ByteBuffer(2 + 1 + 1);
          payload.put_uint16(id(mqtt_broker_port));
          payload.put_uint8(id(mqtt_tls_flags));
          payload.put_uint8(id(mqtt_id)->is_connected());
          std::vector<uint8_t> data = payload.get_data();
          std::vector<std::string> response;
          response.reserve(7);
          response.emplace_back(sensasoil::make_string(&response_command, 1));
          response.emplace_back(id(mqtt_broker_address));
          response.emplace_back(sensasoil::make_string(data.data() + 2, 2));
          response.emplace_back(sensasoil::make_string(data.data() + 4, 1));
          response.emplace_back(sensasoil::make_string(data.data() + 5, 1));
          response.emplace_back(id(mqtt_username));
          response.emplace_back(id(mqtt_discovery_prefix));
          id(improv_rpc_result)->set_value(improv::build_rpc_response(improv::CUSTOM, response, true));
          id(improv_rpc_result)->notify();

  - id: improv_wifi_ble_show_config
    then:
      - lambda: |-
          char ip_buf[network::IP_ADDRESS_BUFFER_SIZE];
          network::IPAddresses ip_addresses = id(wificomponent)->get_ip_addresses();
          if (!ip_addresses.empty()) {
            network::IPAddress ip_address = ip_addresses[0];
            ip_address.str_to(ip_buf);
          } else {
            std::strncpy(ip_buf, "", sizeof(ip_buf));
          }
          uint8_t response_command = static_cast<uint8_t>(sensasoil::ExtendedImprovCommand::WIFI_VIEW_SETTINGS);
          std::vector<std::string> response;
          response.reserve(3);
          response.emplace_back(sensasoil::make_string(&response_command, 1));
          response.emplace_back(id(wifi_ssid));
          response.emplace_back(ip_buf);
          id(improv_rpc_result)->set_value(improv::build_rpc_response(improv::CUSTOM, response, true));
          id(improv_rpc_result)->notify();

  - id: improv_calibration_show_config
    then:
      - lambda: |-
          // Build the payload in one contiguous buffer to avoid allocating multiple times
          bytebuffer::ByteBuffer payload = bytebuffer::ByteBuffer(1 + 1 + 4 + 4 + 4);
          payload.put_uint8(static_cast<uint8_t>(sensasoil::ExtendedImprovCommand::CALIBRATION));
          payload.put_uint8(static_cast<uint8_t>(id(soil_probe_version)));
          payload.put_float(id(soil_probe_calibration_temperature));
          payload.put_float(id(soil_probe_calibration_max_voltage));
          payload.put_float(id(soil_probe_calibration_min_voltage));
          
          // Slice the buffer into separate strings for each field
          std::vector<uint8_t> data = payload.get_data();
          std::vector<std::string> response;
          response.reserve(5);
          response.emplace_back(sensasoil::make_string(data.data(), 1));
          response.emplace_back(sensasoil::make_string(data.data() + 1, 1));
          response.emplace_back(sensasoil::make_string(data.data() + 2, 4));
          response.emplace_back(sensasoil::make_string(data.data() + 6, 4));
          response.emplace_back(sensasoil::make_string(data.data() + 10, 4));
          id(improv_rpc_result)->set_value(improv::build_rpc_response(improv::CUSTOM, response, true));
          id(improv_rpc_result)->notify();

  - id: improv_diagnostic_show_config
    then:
      - lambda: |-
          ESP_LOGD("ExtendedImprov", "Request of diagnostic settings received");
          uint8_t response_command = static_cast<uint8_t>(sensasoil::ExtendedImprovCommand::DIAGNOSTIC);
          std::vector<std::string> response;
          response.reserve(2);
          response.emplace_back(sensasoil::make_string(&response_command, 1));
          uint8_t diagnostic_enabled = id(diagnostic_mode) ? 1 : 0;
          response.emplace_back(sensasoil::make_string(&diagnostic_enabled, 1));
          id(improv_rpc_result)->set_value(improv::build_rpc_response(improv::CUSTOM, response, true));
          id(improv_rpc_result)->notify();

  - id: improv_battery_show_config
    then:
      - lambda: |-
          ESP_LOGD("ExtendedImprov", "Request of battery settings received");
          uint8_t response_command = static_cast<uint8_t>(sensasoil::ExtendedImprovCommand::BATTERY_SETTINGS);
          std::vector<std::string> response;
          response.reserve(2);
          response.emplace_back(sensasoil::make_string(&response_command, 1));
          uint8_t battery_mode = static_cast<uint8_t>(id(battery_floating_mode));
          response.emplace_back(sensasoil::make_string(&battery_mode, 1));
          id(improv_rpc_result)->set_value(improv::build_rpc_response(improv::CUSTOM, response, true));
          id(improv_rpc_result)->notify();

  - id: improv_read_sensors
    then:
      # We have BLE enabled, which can cause interference with the ADC readings,
      # so we wait a bit to let it stabilize
      # TODO: Check optimal delay
      - delay: 500ms
      - script.execute: read_sensors
      - script.wait: read_sensors
      # Update BLE info characteristic with the new sensor readings
      - ble_server.characteristic.notify:
          id: ble_battery_status_char
      - ble_server.characteristic.notify:
          id: ble_sensasoil_info_char
      - ble_server.characteristic.notify:
          id: ble_battery_level_char
