substitutions:
  MQTT_PREFIX: "ss"
  MQTT_DEFAULT_ADDRESS: "192.168.1.68"
  MQTT_DEFAULT_PORT: "1883"
  # Error timeouts
  DELAY_ERROR_WIFI_MS: "2 * 60 * 1000"
  DELAY_ERROR_MQTT_MS: "2 * 60 * 1000"
  SLEEP_ERROR_WIFI_MS: "5 * 60 * 1000"
  SLEEP_ERROR_MQTT_MS: "5 * 60 * 1000"
  # Constants
  INITIAL_UPDATE_ID: "{0, 0, 0}"
  INITIAL_RECEIVED_UPDATE_ID: "{1, 1, 1}"
  ID_TOPIC: "id"
  ID_PAYLOAD_SIZE: "3" # So it encodes perfectly in 4 Base64URL characters
  ID_PAYLOAD_BASE64_LENGTH: "4"
  STATUS_TOPIC: "s"

globals:
  # CONFIGURABLE BY THE USER #
  - id: mqtt_broker_address
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 254
    initial_value: '"${MQTT_DEFAULT_ADDRESS}"'
  - id: mqtt_broker_port
    type: uint16_t
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    initial_value: ${MQTT_DEFAULT_PORT}
  - id: mqtt_username
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 254
    initial_value: '""'
  - id: mqtt_password
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 254
    initial_value: '""'
  - id: mqtt_discovery_prefix
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 64  # ESPHome's MQTT topic prefix limit
    initial_value: '"homeassistant"'
  - id: wifi_ssid
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 254
    initial_value: '""'
  - id: wifi_password
    type: std::string
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    max_restore_data_length: 254
    initial_value: '""'
  - id: mqtt_tls_flags
    type: uint8_t
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
    initial_value: "0x03" # {RESERVEDx6, VERIFY_SSL, USE_TLS}
  # INTERNAL #
  - id: mqtt_initial_connection_setup
    type: bool
    restore_value: yes
    update_interval: ${SAVE_TO_STORAGE_INTERNAL_INTERVAL}
    initial_value: "true"
  - id: mqtt_data_persisted
    type: bool
    restore_value: no
    initial_value: "false"
  - id: received_update_id
    type: uint8_t[${ID_PAYLOAD_SIZE}]
    restore_value: no
    initial_value: ${INITIAL_RECEIVED_UPDATE_ID}
  - id: current_update_id
    type: uint8_t[${ID_PAYLOAD_SIZE}]
    restore_value: no
    initial_value: ${INITIAL_UPDATE_ID}

