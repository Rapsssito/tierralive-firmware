substitutions:
  # Deep sleep duration mapping (minutes)
  SENSASOIL_SLEEP_MAX_MINUTES: "60"
  SENSASOIL_SLEEP_MIN_MINUTES: "10"
  # Sensors
  CHIP_TEMPERATURE_ID: "c_t"
  CHIP_TEMPERATURE_PRECISION: "1"
  NETWORK_SIGNAL_ID: "n_s"
  NETWORK_SIGNAL_PRECISION: "0"
  BATTERY_VOLTAGE_ID: "b_v"
  BATTERY_VOLTAGE_PRECISION: "3"
  SOIL_TEMPERATURE_VOLTAGE_ID: "s_tv"
  SOIL_TEMPERATURE_VOLTAGE_PRECISION: "3"
  SOIL_VWC_VOLTAGE_ID: "s_wv"
  SOIL_VWC_VOLTAGE_PRECISION: "3"
  DEEP_SLEEP_DURATION_ID: "s_d"
  DEEP_SLEEP_DURATION_PRECISION: "1"
  BATTERY_LEVEL_ID: "b_l"
  BATTERY_LEVEL_PRECISION: "2"
  AMBIENT_TEMPERATURE_ID: "a_t"
  AMBIENT_TEMPERATURE_PRECISION: "1"
  AMBIENT_HUMIDITY_ID: "a_h"
  AMBIENT_HUMIDITY_PRECISION: "1"
  SOIL_TEMPERATURE_ID: "s_t"
  SOIL_TEMPERATURE_PRECISION: "1"
  SOIL_VWC_ID: "s_w"
  SOIL_VWC_PRECISION: "1"
  BATTERY_CHARGING_ID: "b_c"
  ERROR_STATE_ID: "er"

globals:
  - id: soil_probe_calibration_temperature
    type: float
    restore_value: yes
    initial_value: "21.9f"
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
  - id: soil_probe_calibration_max_voltage
    type: float
    restore_value: yes
    initial_value: "2.876f"
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
  - id: soil_probe_calibration_min_voltage
    type: float
    restore_value: yes
    initial_value: "0.970f"
    update_interval: ${SAVE_TO_STORAGE_USER_CONFIG_INTERVAL}
  # INTERNAL #
  - id: diagnostic_mode
    type: bool
    restore_value: yes
    initial_value: "false"
    update_interval: ${SAVE_TO_STORAGE_INTERNAL_INTERVAL}

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    id: wifi_signal_db_internal
    update_interval: never
    internal: true
  - platform: internal_temperature
    id: chip_temperature_internal
    internal: true
    update_interval: never
  - platform: template
    id: deep_sleep_duration_internal
    internal: true
    update_interval: never
    lambda: |-
        const float max_sleep_minutes = ${SENSASOIL_SLEEP_MAX_MINUTES};
        const float min_sleep_minutes = ${SENSASOIL_SLEEP_MIN_MINUTES};
        float battery = id(battery_level_internal).state;
        if (isnan(battery)) {
          return max_sleep_minutes;
        }

        if (battery < 0.0f) {
          battery = 0.0f;
        } else if (battery > 100.0f) {
          battery = 100.0f;
        }

        return max_sleep_minutes - ((max_sleep_minutes - min_sleep_minutes) * (battery / 100.0f));
  - platform: template
    id: soil_temperature_internal
    internal: true
    update_interval: never
    lambda: |-
      return sensasoil::compute_soil_temperature(id(soil_temperature_v_internal).state, id(soil_probe_version));
  - platform: template
    id: soil_volumetric_water_internal
    internal: true
    update_interval: never
    lambda: |-
      return sensasoil::compute_soil_vwc(id(soil_volumetric_water_v_internal).state, id(soil_temperature_internal).state, id(soil_probe_calibration_temperature), id(soil_probe_calibration_min_voltage), id(soil_probe_calibration_max_voltage), id(soil_probe_version));

text_sensor:
  - platform: template
    id: error_state_internal
    internal: true
    update_interval: never
    lambda: |-
        switch (esp_reset_reason()) {
        case ESP_RST_PANIC:
        return std::string("PANIC_RESET");
        case ESP_RST_INT_WDT:
        case ESP_RST_TASK_WDT:
        case ESP_RST_WDT:
        return std::string("WDT_RESET");
        case ESP_RST_BROWNOUT:
        return std::string("BROWNOUT_RESET");
        case ESP_RST_EFUSE:
        return std::string("EFUSE_RESET");
        case ESP_RST_PWR_GLITCH:
        return std::string("PWR_GLITCH_RESET");
        case ESP_RST_CPU_LOCKUP:
        return std::string("CPU_LOCKUP_RESET");
        default:
        break;
        }
        switch (id(last_exec_error)) {
        case sensasoil::ErrorCode::WIFI:
        return std::string("WIFI_ERROR");
        case sensasoil::ErrorCode::OTA:
        return std::string("OTA_ERROR");
        case sensasoil::ErrorCode::MQTT:
        return std::string("MQTT_ERROR");
        case sensasoil::ErrorCode::MQTT_ACK_TIMEOUT:
        return std::string("MQTT_ACK_TIMEOUT");
        case sensasoil::ErrorCode::MQTT_PUBLISH_FAILED:
        return std::string("MQTT_PUBLISH_FAILED");
        case sensasoil::ErrorCode::NONE:
        return std::string("0");
        default:
        return std::string("UNKNOWN_ERROR");
        }

light:
  - platform: monochromatic
    id: led_status
    name: "Status LED"
    output: led_status_output_internal  # Must be defined by the device configuration
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          # Blink 2.5 times every second
          name: "wifi_disconnect_effect"
          transition_length: 200ms
          update_interval: 200ms
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          # Blink quickly every second
          name: "mqtt_disconnect_effect"
          transition_length:
            on_length: 200ms
            off_length: 1ms
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          # Pulse slowly every 4 seconds
          name: "ble_status_effect"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 40%
          max_brightness: 100%
    internal: True

button:
  - platform: factory_reset
    id: factory_reset_button
    internal: True
  - platform: restart
    id: restart_button
    internal: True

script:
  - id: read_sensors
    mode: restart
    then:
      # Read specific sensors
      - script.execute: read_sensors_specific
      - script.wait: read_sensors_specific
      # Update template sensors based on the voltage
      - component.update: soil_temperature_internal
      - component.update: soil_volumetric_water_internal
      # Rest of internal sensors
      - component.update: deep_sleep_duration_internal
      - component.update: wifi_signal_db_internal
      - component.update: chip_temperature_internal
      - component.update: error_state_internal

  - id: publish_sensors
    mode: restart
    then:
    - lambda: |-
        // Build the JSON payload
        esphome::json::JsonBuilder builder;
        JsonObject root = builder.root();

        // Populate the object
        if (id(diagnostic_mode)) {
          root["${CHIP_TEMPERATURE_ID}"] = sensasoil::rounded_float_to_string(id(chip_temperature_internal).state, ${CHIP_TEMPERATURE_PRECISION});
          root["${NETWORK_SIGNAL_ID}"] = sensasoil::rounded_float_to_string(id(wifi_signal_db_internal).state, ${NETWORK_SIGNAL_PRECISION});
          root["${BATTERY_VOLTAGE_ID}"] = sensasoil::rounded_float_to_string(id(battery_voltage_internal).state, ${BATTERY_VOLTAGE_PRECISION});
          root["${SOIL_TEMPERATURE_VOLTAGE_ID}"] = sensasoil::rounded_float_to_string(id(soil_temperature_v_internal).state, ${SOIL_TEMPERATURE_VOLTAGE_PRECISION});
          root["${SOIL_VWC_VOLTAGE_ID}"] = sensasoil::rounded_float_to_string(id(soil_volumetric_water_v_internal).state, ${SOIL_VWC_VOLTAGE_PRECISION});
        }
        root["${DEEP_SLEEP_DURATION_ID}"] = sensasoil::rounded_float_to_string(id(deep_sleep_duration_internal).state, ${DEEP_SLEEP_DURATION_PRECISION});
        root["${BATTERY_LEVEL_ID}"] = sensasoil::rounded_float_to_string(id(battery_level_internal).state, ${BATTERY_LEVEL_PRECISION});
        root["${AMBIENT_TEMPERATURE_ID}"] = sensasoil::rounded_float_to_string(id(ambient_temperature_internal).state, ${AMBIENT_TEMPERATURE_PRECISION});
        root["${AMBIENT_HUMIDITY_ID}"] = sensasoil::rounded_float_to_string(id(ambient_humidity_internal).state, ${AMBIENT_HUMIDITY_PRECISION});
        root["${SOIL_TEMPERATURE_ID}"] = sensasoil::rounded_float_to_string(id(soil_temperature_internal).state, ${SOIL_TEMPERATURE_PRECISION});
        root["${SOIL_VWC_ID}"] = sensasoil::rounded_float_to_string(id(soil_volumetric_water_internal).state, ${SOIL_VWC_PRECISION});
        root["${BATTERY_CHARGING_ID}"] = id(is_battery_charging_internal).state ? "1" : "0";
        root["${ERROR_STATE_ID}"] = id(error_state_internal).state;

        // Serialize the object into a buffer
        auto json_buffer = builder.serialize();
        id(publish_mqtt_message)->execute(id(mqtt_id).get_topic_prefix() + "/${STATUS_TOPIC}", std::string(json_buffer.data(), json_buffer.size()), 1, true);
    - script.wait: publish_mqtt_message

  - id: publish_sensors_discovery
    mode: restart
    then:
      - lambda: |-
          // Skip re-sending MQTT discovery if already sent or if discovery prefix is not set
          if (!id(mqtt_initial_connection_setup) || id(mqtt_discovery_prefix) == "") {
            return;
          }

          // Build the JSON payload
          esphome::json::JsonBuilder builder;
          JsonObject root = builder.root();

          // Add info
          root[MQTT_STATE_TOPIC] = id(mqtt_id).get_topic_prefix() + "/${STATUS_TOPIC}";
          root[MQTT_QOS] = 1;

          char mac_base32[sensasoil::MAC_BASE32_BUFFER_SIZE];
          sensasoil::get_mac_base32(mac_base32);

          // Create a MQTT_DEVICE object for device information
          JsonObject dev = root[MQTT_DEVICE].to<JsonObject>();
          dev[MQTT_DEVICE_IDENTIFIERS] = mac_base32;
          dev[MQTT_NAME] = App.get_friendly_name() + " " + std::string(mac_base32, sensasoil::MAC_BASE32_LENGTH);
          dev[MQTT_DEVICE_SW_VERSION] = "${FIRMWARE_VERSION}";
          dev[MQTT_DEVICE_HW_VERSION] = "${HARDWARE_VERSION}";
          dev[MQTT_DEVICE_MODEL] = "SensaSoil";
          dev[MQTT_DEVICE_MANUFACTURER] = "TierraLive";
          JsonArray connections = dev[MQTT_DEVICE_CONNECTIONS].to<JsonArray>();
          JsonArray mac_connection = connections.add<JsonArray>();
          mac_connection.add("mac");
          char mac_hex[MAC_ADDRESS_BUFFER_SIZE];
          get_mac_address_into_buffer(mac_hex);
          mac_connection.add(mac_hex);

          // Origin
          JsonObject origin = root["o"].to<JsonObject>();
          origin[MQTT_NAME] = "TierraLive SensaSoil";

          // Create sensors
          JsonObject cmps = root["cmps"].to<JsonObject>();
          char unique_id[sensasoil::MAC_UNIQUE_ID_BUFFER_SIZE];
          JsonObject sensor;

          if (id(diagnostic_mode)) { // Start of diagnostic sensors
          // Chip temperature
          sensor = cmps["${CHIP_TEMPERATURE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${CHIP_TEMPERATURE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Chip temperature";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "°C";
          sensor[MQTT_DEVICE_CLASS] = "temperature";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${CHIP_TEMPERATURE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${CHIP_TEMPERATURE_ID} }}";

          // Network signal
          sensor = cmps["${NETWORK_SIGNAL_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${NETWORK_SIGNAL_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Network signal";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "dBm";
          sensor[MQTT_DEVICE_CLASS] = "signal_strength";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${NETWORK_SIGNAL_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${NETWORK_SIGNAL_ID} }}";

          // Battery voltage
          sensor = cmps["${BATTERY_VOLTAGE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${BATTERY_VOLTAGE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Battery voltage";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "V";
          sensor[MQTT_DEVICE_CLASS] = "voltage";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${BATTERY_VOLTAGE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${BATTERY_VOLTAGE_ID} }}";

          // Soil temperature voltage
          sensor = cmps["${SOIL_TEMPERATURE_VOLTAGE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${SOIL_TEMPERATURE_VOLTAGE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Soil temperature voltage";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "V";
          sensor[MQTT_DEVICE_CLASS] = "voltage";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${SOIL_TEMPERATURE_VOLTAGE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${SOIL_TEMPERATURE_VOLTAGE_ID} }}";

          // Soil volumetric water voltage
          sensor = cmps["${SOIL_VWC_VOLTAGE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${SOIL_VWC_VOLTAGE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Soil volumetric water voltage";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "V";
          sensor[MQTT_DEVICE_CLASS] = "voltage";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${SOIL_VWC_VOLTAGE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${SOIL_VWC_VOLTAGE_ID} }}";

          } // End of diagnostic sensors

          // Deep sleep duration
          sensor = cmps["${DEEP_SLEEP_DURATION_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${DEEP_SLEEP_DURATION_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Deep sleep duration";
          sensor[MQTT_ICON] = "mdi:clock-outline";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "minutes";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${DEEP_SLEEP_DURATION_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${DEEP_SLEEP_DURATION_ID} }}";

          // Battery level
          sensor = cmps["${BATTERY_LEVEL_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${BATTERY_LEVEL_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Battery level";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "%";
          sensor[MQTT_DEVICE_CLASS] = "battery";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${BATTERY_LEVEL_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${BATTERY_LEVEL_ID} }}";

          // Ambient temperature
          sensor = cmps["${AMBIENT_TEMPERATURE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${AMBIENT_TEMPERATURE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Ambient temperature";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "°C";
          sensor[MQTT_DEVICE_CLASS] = "temperature";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${AMBIENT_TEMPERATURE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${AMBIENT_TEMPERATURE_ID} }}";

          // Ambient humidity
          sensor = cmps["${AMBIENT_HUMIDITY_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${AMBIENT_HUMIDITY_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Ambient humidity";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "%";
          sensor[MQTT_DEVICE_CLASS] = "humidity";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${AMBIENT_HUMIDITY_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${AMBIENT_HUMIDITY_ID} }}";

          // Soil temperature
          sensor = cmps["${SOIL_TEMPERATURE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${SOIL_TEMPERATURE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Soil temperature";
          sensor[MQTT_ICON] = "mdi:thermometer-probe";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "°C";
          sensor[MQTT_DEVICE_CLASS] = "temperature";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${SOIL_TEMPERATURE_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${SOIL_TEMPERATURE_ID} }}";

          // Soil volumetric water
          sensor = cmps["${SOIL_VWC_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${SOIL_VWC_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Soil volumetric water";
          sensor[MQTT_ICON] = "mdi:water-percent";
          sensor[MQTT_UNIT_OF_MEASUREMENT] = "%";
          sensor[MQTT_DEVICE_CLASS] = "moisture";
          sensor[MQTT_STATE_CLASS] = "measurement";
          sensor[MQTT_SUGGESTED_DISPLAY_PRECISION] = ${SOIL_VWC_PRECISION};
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${SOIL_VWC_ID} }}";

          // Battery charging
          sensor = cmps["${BATTERY_CHARGING_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${BATTERY_CHARGING_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "binary_sensor";
          sensor[MQTT_NAME] = "Battery charging";
          sensor[MQTT_DEVICE_CLASS] = "battery_charging";
          sensor[MQTT_PAYLOAD_ON] = "1";
          sensor[MQTT_PAYLOAD_OFF] = "0";
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${BATTERY_CHARGING_ID} }}";

          // Error state
          sensor = cmps["${ERROR_STATE_ID}"].to<JsonObject>();
          sensasoil::build_mac_unique_id(mac_base32, "${ERROR_STATE_ID}", unique_id);
          sensor[MQTT_UNIQUE_ID] = unique_id;
          sensor["p"] = "sensor";
          sensor[MQTT_NAME] = "Error state";
          sensor[MQTT_ICON] = "mdi:alert-outline";
          sensor[MQTT_ENTITY_CATEGORY] = "diagnostic";
          sensor[MQTT_VALUE_TEMPLATE] = "{{ value_json.${ERROR_STATE_ID} }}";

          char mac_base64url[sensasoil::MAC_BASE64URL_BUFFER_SIZE];
          sensasoil::get_mac_base64url(mac_base64url);
          // Serialize the object into a buffer
          auto json_buffer = builder.serialize();
          // Publish the discovery message
          id(publish_mqtt_message)->execute(id(mqtt_discovery_prefix) + "/device/" + std::string(mac_base64url, sensasoil::MAC_BASE64URL_LENGTH) + "/config", std::string(json_buffer.data(), json_buffer.size()), 1, true);
      - script.wait: publish_mqtt_message
