packages:
  sensasoil_common: !include ../../common/config/common.yaml
  entities: !include entities.yaml

substitutions:
  HARDWARE_VERSION: "4.0"
  HARDWARE_VERSION_FLAT: "4-0"
  FIRMWARE_VERSION: !env_var FIRMWARE_VERSION

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

i2c:
  - id: i2c_bus
    sda: GPIO11
    scl: GPIO10
    frequency: 100kHz
    scan: false
    sda_pullup_enabled: false
    scl_pullup_enabled: false


bq25186:
  id: bq25186_charger
  configure_on_boot: false
  update_interval: never
  fast_charge_current: 500  # USB 2.0 limit
  termination_percent: 5%
  watchdog: disabled
  vindpm_mode: battery_tracking
  battery_ocp_limit: 1500ma
  safety_timer: disabled
  input_current_limit: 500ma  # USB 2.0 limit
  enable_push_button: false
  system_regulation: pass_through
  mask_charge_status_interrupt: true
  mask_vindpm_interrupt: true
  mask_ts_interrupt: true
  mask_treg_interrupt: true
  mask_bat_interrupt: true
  mask_pg_interrupt: true

script:
  - id: setup_battery
    mode: restart
    parameters:
      force_apply: bool
    then:
      - lambda: |-
          // Do not apply the configuration unless manual_reset, initial connection or force is true
          if (!(id(manual_reset) || id(mqtt_initial_connection_setup) || force_apply)) {
            id(setup_battery)->stop();
            return;
          }
      - if:
          condition:
            lambda: 'return id(battery_floating_mode) == sensasoil::BatteryFloatingMode::MAX_LIFESPAN;'
          then:
            - bq25186.apply_configuration:
                id: bq25186_charger
                battery_regulation_voltage: 3850 # 50% capacity / 6,000 - 10,000+ cycles
            - script.stop: setup_battery
      - if:
          condition:
            lambda: 'return id(battery_floating_mode) == sensasoil::BatteryFloatingMode::BALANCED;'
          then:
            - bq25186.apply_configuration:
                id: bq25186_charger
                battery_regulation_voltage: 4040 # 80% capacity / 1,200 - 2,000 cycles
            - script.stop: setup_battery
      - if:
          condition:
            lambda: 'return id(battery_floating_mode) == sensasoil::BatteryFloatingMode::MAX_CAPACITY;'
          then:
            - bq25186.apply_configuration:
                id: bq25186_charger
                battery_regulation_voltage: 4200 # 100% capacity / 300 - 500 cycles
            - script.stop: setup_battery
